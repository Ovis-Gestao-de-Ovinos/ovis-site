<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/site.css?v=22">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; }
.og-photo { position: absolute; inset: 0 0 0 480px; background: url(/assets/video/hero.avif) 62% 40% / cover; }
.og-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, rgba(10,14,11,.55) 28%, rgba(10,14,11,.1) 60%); }
.og-copy { position: absolute; left: 64px; top: 56px; bottom: 56px; width: 620px; display: flex; flex-direction: column; }
.og-brand { display: flex; align-items: center; gap: 14px; font: 600 30px var(--sans); color: var(--text); }
.og-brand img { width: 46px; height: 46px; }
.og-kicker { margin-top: auto; font: 500 24px var(--sans); color: var(--accent); }
.og-title { margin: 8px 0 0; font: 400 118px/0.9 var(--display); text-transform: uppercase; color: var(--text); }
.og-sub { margin-top: 16px; font: 500 28px/1.3 var(--sans); color: var(--text-2); }
.og-chip { position: absolute; right: 56px; bottom: 56px; padding: 18px 24px; border-radius: 22px; background: rgba(10,14,11,.78); border: 1px solid var(--line); backdrop-filter: blur(8px); }
.og-chip strong { display: block; font: 400 64px/1 var(--display); color: var(--accent); }
.og-chip em { font: 600 26px var(--sans); font-style: normal; color: var(--text); margin-left: 4px; }
.og-chip span { font: 500 18px var(--sans); color: var(--text-2); }
.og-url { margin-top: 26px; font: 500 22px var(--sans); color: var(--text-3); }
</style></head><body><div class="og">
<div class="og-photo"></div>
<div class="og-copy">
  <div class="og-brand"><img src="/assets/icon.png" alt=""><span>Ovis</span></div>
  <div class="og-kicker">Ferramenta grátis</div>
  <h1 class="og-title">Calculadora<br>de GMD</h1>
  <div class="og-sub">Ganho médio diário de cordeiros e ovinos, com duas pesagens</div>
  <div class="og-url">ovisapp.com.br/calculadora-gmd</div>
</div>
<div class="og-chip"><strong>217 <em>g/dia</em></strong><span>32 → 38,5 kg em 30 dias</span></div>
</div></body></html>
